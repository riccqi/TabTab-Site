name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TABTAB_SUBSCRIPTION_ROLLOUT: "on"
      # The new plans' production Polar checkouts. Until these repository variables are
      # set, the "on" build fails, which blocks this workflow.
      TABTAB_POLAR_CHECKOUT_MONTHLY_URL: ${{ vars.TABTAB_POLAR_CHECKOUT_MONTHLY_URL }}
      TABTAB_POLAR_CHECKOUT_ANNUAL_URL: ${{ vars.TABTAB_POLAR_CHECKOUT_ANNUAL_URL }}
      TABTAB_POLAR_CHECKOUT_LIFETIME_URL: ${{ vars.TABTAB_POLAR_CHECKOUT_LIFETIME_URL }}
      TABTAB_POLAR_PORTAL_URL: https://polar.sh/tabtabapp/portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
