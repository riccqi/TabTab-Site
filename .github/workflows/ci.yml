name: Verify site

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TABTAB_SUBSCRIPTION_ROLLOUT: "on"
      TABTAB_POLAR_CHECKOUT_URL: https://api.polar.sh/v1/checkout-links/polar_cl_xUfKGtMMTdza7ZCvzGAjePjlTzEtGgVEbBeBK2S3v8Q/redirect
      TABTAB_POLAR_PORTAL_URL: https://polar.sh/tabtabapp/portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, build, and validate routes
        run: npm run verify
